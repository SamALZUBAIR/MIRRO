name: Import Iris Gallery source into MIRRO

on:
  push:
    branches: [main]
    paths:
      - "IMPORT_IRIS_GALLERY.txt"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MIRRO import branch
        uses: actions/checkout@v4
        with:
          ref: import/iris-gallery
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream source
        run: git clone --depth 1 https://github.com/MohamadOday/iris-gallery.git /tmp/iris-gallery

      - name: Replace branch contents with upstream source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/iris-gallery/. .
          rm -f local.properties
          mv README.md UPSTREAM_README.md
          cat > README.md <<'EOF'
          # MIRRO — Android Gallery

          This branch imports Iris Gallery (https://github.com/MohamadOday/iris-gallery) as the initial technical base for MIRRO.

          ## Import status
          - Upstream source copied into this branch.
          - Machine-specific local.properties intentionally omitted.
          - Original upstream README preserved as UPSTREAM_README.md.
          - Upstream license preserved in LICENSE.
          - This is an unmodified source import, not yet rebranded as MIRRO.
          - No APK build has been run or verified by this import workflow.

          ## Build
          The upstream project uses Kotlin, Jetpack Compose, Android Gradle Plugin, and the Gradle wrapper. Open it in Android Studio or run ./gradlew assembleDebug in an environment with a compatible JDK and Android SDK installed.

          ## Before publishing
          1. Build and test the untouched imported baseline.
          2. Change application label, application ID, icon, splash screen, and visual identity.
          3. Review third-party asset/model licenses and keep required notices.
          4. Follow the GPL-3.0 license obligations before distributing modified builds.
          EOF

      - name: Commit and push imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Iris Gallery source as MIRRO base"
          git push origin HEAD:import/iris-gallery
